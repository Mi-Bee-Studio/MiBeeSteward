name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build the frontend once, then share the produced web/dist/ as an artifact.
  # Both the `go` job (which embeds web/dist via go:embed) and the frontend
  # test job consume it, so neither has to rebuild independently.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist

  # Rust agent (agent-rs/): the cargo workspace is NOT part of the Go module,
  # so its tests need their own job. Without this job a change that breaks the
  # Rust suite ships silently — field-found 2026-10-09: the embedded corpus
  # grew 2638 -> 2639 and the count-pinning test had been red for a day with
  # no CI signal (the pin is now a floor; the job is the gate).
  # The full-corpus load test reads configs/fingerprints via the nested-layout
  # path, so assets stay in sync by construction; check-agent-rs-assets in the
  # sqlc-verify job still guards the embedded copies.
  agent-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-rs/target
          key: agent-rs-${{ runner.os }}-cargo-${{ hashFiles('agent-rs/Cargo.lock') }}
      - name: Sync embedded assets (test fixtures read configs/)
        run: make sync-agent-rs-assets
      - name: cargo test
        working-directory: agent-rs
        run: cargo test --locked
      # eBPF observer (#498): the loader path (aya) + the linux-only agent
      # wiring only compile under the feature; the object-parse test proves
      # aya understands the bpf2go artifact on every PR (loading into the
      # kernel is rig-verified, CI has no privileges for it).
      - name: cargo test (ebpf feature)
        working-directory: agent-rs
        run: cargo test --locked -p mibee-ebpf --features loader && cargo test --locked -p mibee-agent --features ebpf

  # agent-rs line-coverage ratchet (#559): the Rust mirror of the Go side's
  # coverage-floor gate. Separate job so the instrumented rebuild never
  # slows the plain test job. cargo-llvm-cov needs the llvm-tools-preview
  # component; the floor lives in agent-rs/coverage-floor.txt and only moves
  # up (make coverage-agent-rs-bump re-pins).
  agent-rs-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-rs/target
          key: agent-rs-cov-${{ runner.os }}-cargo-${{ hashFiles('agent-rs/Cargo.lock') }}
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Sync embedded assets (test fixtures read configs/)
        run: make sync-agent-rs-assets
      - name: Coverage gate
        run: make coverage-agent-rs-gate

  # Optional build tags (#502): the release ships a -full variant with
  # WITH_LLDP,WITH_CDP,WITH_ARPSCAN, and those code paths never compile in
  # the default `go vet/test ./...` — the reals are Linux-only (AF_PACKET).
  # Guard them on every PR: vet + the tag-gated introspection tests + a full
  # center build with all three tags.
  optional-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet -tags "WITH_LLDP,WITH_CDP,WITH_ARPSCAN" ./internal/service/scannerv2/discovery/
      - run: go test -tags "WITH_LLDP,WITH_CDP,WITH_ARPSCAN" ./internal/service/scannerv2/discovery/
      # go:embed needs web/dist for a cmd/server build; a stub index is
      # enough to prove the tagged binary LINKS.
      - name: Build center with all optional tags (embed stub)
        run: |
          mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
          CGO_ENABLED=0 go build -tags "WITH_LLDP,WITH_CDP,WITH_ARPSCAN" -o /tmp/mibee-full ./cmd/server/
          file /tmp/mibee-full
      # eBPF generation guards (#537): (a) the go:generate directive keeps
      # -tags WITH_EBPF so generated files can never compile into DEFAULT
      # builds; (b) generating on a clean tree and building WITHOUT the tag
      # must still pass (the ELF does not leak); (c) the tagged build passes
      # with the artifacts present.
      - name: eBPF generate guards (no-leak + tagged build, #537)
        run: |
          grep -q -- '-tags WITH_EBPF' internal/service/scannerv2/ebpf/observer_real.go             || { echo '::error::go:generate directive lost -tags WITH_EBPF'; exit 1; }
          test ! -f internal/service/scannerv2/ebpf/tcingress_bpfel.go             || { echo '::error::generated eBPF artifacts must never be committed'; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm >/dev/null
          mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
          go generate -tags WITH_EBPF ./internal/service/scannerv2/ebpf/
          CGO_ENABLED=0 go build ./...                       # default: no ELF leak
          CGO_ENABLED=0 go build -tags WITH_EBPF ./cmd/server/  # tagged: links the loader
          rm -f internal/service/scannerv2/ebpf/tcingress_*

  go:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # web/dist/ is gitignored (a build artifact) but go:embed all:dist
      # requires it at compile time — restore the frontend build here.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
      - run: go vet ./...
      - name: Generated Go API client drift check (#274)
        run: |
          make gen-api-go
          git diff --exit-code -- internal/apiclient/ || {
            echo "::error::internal/apiclient/client.gen.go is out of sync with docs/openapi.yaml — run 'make gen-api-go' and commit the result"
            exit 1
          }
      - uses: golangci/golangci-lint-action@v7
        with:
          # golangci-lint v2 requires golangci-lint-action v7+.
          # Pin to an explicit version — the action rejects ranges like 'v2.x'.
          version: v2.12.2
      # Coverage ratchet gate: cross-package profile (excludes sqlc/oapi-codegen
      # generated code — those have their own drift jobs) + a floor in
      # scripts/coverage-floor.txt that only moves up (`make coverage-bump`).
      - name: Test with coverage (ratchet gate)
        run: |
          make coverage RACE=-race
          make coverage-gate
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: cover.out

  # Cross-compile the whole tree for Windows from the Linux runner (build-only,
  # no tests — Windows is a dev platform for this repo, deployments are Linux).
  # Guards against bare-syscall regressions like #321, where
  # discovery/multicast.go used int-fd setsockopt calls with no build tag and
  # silently broke `go build ./...` for every Windows contributor. go vet is
  # included because it type-checks for the target platform too.
  windows-build:
    needs: build-frontend
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
      - run: go vet ./...
      - run: go build ./...

  frontend-test:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: API client types drift check (#274)
        working-directory: web
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts || {
            echo "::error::src/lib/api/schema.d.ts is out of sync with docs/openapi.yaml — run 'npm run gen:api' (in web/) and commit the result"
            exit 1
          }
      # Coverage ratchet gate: thresholds in vitest.config.ts are the measured
      # baseline — vitest exits non-zero if any metric drops below them.
      - working-directory: web
        run: npm run test:coverage

  sqlc-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install sqlc
        run: |
          # v1.31.1 is the version the committed internal/db was generated
          # with; a different version reformats headers and breaks the drift
          # check below (#237).
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc version
      # `sqlc compile` validates queries against the schema locally without
      # requiring a sqlc Cloud project (which `sqlc verify` does).
      - run: sqlc compile
      # Drift guard (#237): the committed internal/db MUST equal a fresh
      # `sqlc generate` on the committed db/schema.sql + db/queries/. This
      # fails when schema.sql or queries change without regenerating — the
      # exact drift that #233 introduced and #235 had to surgically work
      # around.
      - name: Check generated code is in sync
        run: |
          sqlc generate
          git diff --exit-code internal/db/
      # Drift guard for the Rust agent's embedded copies of configs/ (the
      # third copy in the tree — configs/ is truth; agent-rs assets are
      # build-time copies, same contract as the Go embed dirs).
      - name: Check agent-rs assets are in sync
        run: make check-agent-rs-assets

  # Validate that the container image builds (build only, no push). Catches
  # Dockerfile/docker-compose regressions before they hit a release tag — the
  # actual publish happens in release.yml on v* tags. Single-platform (amd64)
  # to keep CI fast; the release workflow does the full multi-arch build.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: mibee-steward:ci
          build-args: |
            BUILD_TAGS=
      - name: Smoke-test the built image
        run: |
          # Boot it, wait for /health, then shut down. Confirms the binary
          # runs as the non-root USER and the DB volume is writable. We mount
          # a minimal config — the CMD looks for /app/configs/config.yaml and
          # the binary refuses to start without one.
          mkdir -p /tmp/ci-config
          cat > /tmp/ci-config/config.yaml <<'YAML'
          server: {port: 8080, host: "0.0.0.0"}
          database: {sqlite: {path: "/data/mibee.db"}}
          auth:
            jwt_secret: "ci-smoke-test-secret-not-for-production-use-32chars"
            initial_admin_password: "CiSmokeTest@2026"
            cookie_secure: false
          scanner: {enabled: false}
          YAML
          docker run -d --name mibee-ci -p 18080:8080 \
            -v /tmp/ci-config/config.yaml:/app/configs/config.yaml:ro \
            mibee-steward:ci
          trap 'docker rm -f mibee-ci' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/api/v1/health; then echo; echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "health check timed out" >&2
          docker logs mibee-ci
          exit 1

  # OpenWrt packaging gate (#358): the router-form sources (LuCI controller +
  # templates, installer, packaging scripts) are invisible to go test, yet the
  # R68S field session (#355) proved they fail "local-green, on-router-dead" —
  # a template CR byte white-screens LuCI with "unfinished string", a Lua
  # syntax slip kills the controller. Static assertions (luac -p, committed-tree
  # CR scan, sh -n) plus a full packaging smoke: package-openwrt-ipk builds the
  # arm64 binary, runs the openwrt-stage CR staging guard, and assembles the
  # ipk via mkipk.sh — the exact pipeline a release artifact goes through.
  openwrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # OpenWrt 24.10's LuCI Lua runtime is 5.1 — syntax-check against it.
      - name: Install lua 5.1
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1
      - name: Static assertions (luac -p / committed-tree CR scan / sh -n)
        run: make check-openwrt
      - name: Packaging smoke (stage guard + mkipk.sh, center)
        run: |
          (cd web && npm ci)
          make package-openwrt-ipk
          ls -la bin/*.ipk
      # PKG_DEPS smoke (#535): re-run mkipk.sh on the staged tree with the
      # variable set and assert the Depends line actually lands in the ipk's
      # control member — the exact regression #535 pinned (the scripts read
      # PKG_DEPENDS while everything else said PKG_DEPS, silently).
      # Feed index smoke (#563): the feed generator must produce an opkg-
      # standard index (Packages + Packages.gz) with both packages and
      # SHA256sum stanzas — the same directory a self-hosted feed serves.
      - name: Feed index smoke (make feed-index, #563)
        run: |
          make feed-index
          test -s dist/feed/arm64/Packages && test -s dist/feed/arm64/Packages.gz
          grep -c '^Package:' dist/feed/arm64/Packages | grep -qv '^0$'
          grep -q '^SHA256sum: ' dist/feed/arm64/Packages
          grep -q '^Filename: ' dist/feed/arm64/Packages
      - name: PKG_DEPS smoke (Depends must land in the ipk control, #535)
        run: |
          PKG_DEPS="+kmod-sched-bpf" sh deploy/openwrt/mkipk.sh bin/openwrt-stage 0.0.0-depsmoke arm64 /tmp/deps-smoke.ipk
          rm -rf /tmp/deps-smoke && mkdir -p /tmp/deps-smoke && cd /tmp/deps-smoke
          tar xzf /tmp/deps-smoke.ipk ./control.tar.gz
          tar xzf control.tar.gz ./control
          grep -F 'Depends: +kmod-sched-bpf' ./control
      # Agent packaging smoke: AGENT_BIN with a placeholder file fully
      # exercises the stage rule + tarball + .ipk + .apk paths (nothing
      # executes the binary at BUILD time — the router's preinst does, at
      # install time), so the agent chain gets per-PR validation without a
      # cargo-zigbuild install here.
      - name: Agent packaging smoke (stage guard + mkipk/mkapk, agent)
        run: |
          echo placeholder > /tmp/dummy-mibee-agent
          AGENT_BIN=/tmp/dummy-mibee-agent make package-openwrt-agent-rs package-openwrt-agent-rs-ipk package-openwrt-agent-rs-apk
          ls -la bin/mibee-agent*

  # Docs governance (#319 / #322): fence-language lint (MD040) so the website's
  # highlight.js rendering never regresses into mixed highlighted/monochrome
  # code blocks, plus a drift guard that regenerates the docs changelog
  # mirrors and fails when CHANGELOG.md changed without running
  # `make docs-changelog-sync`. markdownlint-cli2 is pinned like every other
  # CI tool in this repo (sqlc v1.31.1, golangci-lint v2.12.2).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: markdownlint (MD040 fenced-code-language)
        run: npx -y markdownlint-cli2@0.23.2 "**/*.md"
      - name: Changelog docs sync check
        # regenerates the en mirror (must match the committed copy) and
        # version-checks the hand-maintained zh translation
        run: |
          ./scripts/gen_changelog_mirror.sh
          git diff --exit-code -- docs/en/changelog.md
