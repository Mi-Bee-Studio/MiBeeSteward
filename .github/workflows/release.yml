name: Release

# Builds amd64 + arm64 binaries for both the center (cmd/server, embeds the
# frontend) and the discovery agent (cmd/agent, no SPA), the three OpenWrt/
# iStoreOS router package forms (tarball / .ipk / .apk, arm64 - #359), and a
# multi-arch container image on GHCR (ghcr.io/<owner>/<repo>); everything is
# attached to the GitHub Release. CGO-free; SQLite via modernc.org/sqlite.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required by softprops/action-gh-release to create the release
  packages: write  # required to push the container image to GHCR

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist

  release:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # web/dist/ is gitignored but go:embed all:dist requires it at build time.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # Inject the git tag (e.g. v0.1.0) as the version string.
        run: |
          VERSION=${GITHUB_REF_NAME}
          go build -ldflags "-s -w -X mibee-steward/internal/version.Version=${VERSION}" \
            -o mibee-steward-${GOOS}-${GOARCH} ./cmd/server/
      - name: Verify version (amd64 only)
        if: matrix.goarch == 'amd64'
        run: ./mibee-steward-${{ matrix.goos }}-${{ matrix.goarch }} -version
      - name: Verify binary (arm64 — file check, can't execute on amd64 runner)
        if: matrix.goarch == 'arm64'
        run: file mibee-steward-${{ matrix.goos }}-${{ matrix.goarch }}
      # Discovery agent (cmd/agent): no SPA, no frontend artifact needed. Same
      # version ldflags so `mibee-agent -version` reports the release tag.
      - name: Build agent binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          go build -ldflags "-s -w -X mibee-steward/internal/version.Version=${VERSION}" \
            -o mibee-agent-${GOOS}-${GOARCH} ./cmd/agent/
      - name: Verify agent version (amd64 only)
        if: matrix.goarch == 'amd64'
        run: ./mibee-agent-${{ matrix.goos }}-${{ matrix.goarch }} -version
      - name: Verify agent binary (arm64 — file check, can't execute on amd64 runner)
        if: matrix.goarch == 'arm64'
        run: file mibee-agent-${{ matrix.goos }}-${{ matrix.goarch }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            mibee-steward-${{ matrix.goos }}-${{ matrix.goarch }}
            mibee-agent-${{ matrix.goos }}-${{ matrix.goarch }}

  # Router-form packages (#359): the same pipeline CI's `openwrt` job smokes
  # (arm64 build -> openwrt-stage CR guard -> packaging scripts), producing all
  # three install forms for OpenWrt/iStoreOS - tarball (scp + ./install.sh),
  # .ipk (opkg), .apk (OpenWrt 24.10+ apk-tools) - plus a SHA256SUMS file —
  # for BOTH forms: the center (mibee-steward) and the distributed agent
  # (mibee-agent, form B: agent-on-router reporting to a remote center).
  # arm64 only: both field-verified routers (GL.iNet MT2500, FastRhino R68S)
  # and current OpenWrt target hardware are aarch64; 32-bit ARM users build
  # locally via `make build-linux-arm` (docs/{zh,en}/openwrt.md).
  # Self-contained like the docker job (the Makefile builds the frontend).
  openwrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build all three router package forms (center + agent)
        run: |
          (cd web && npm ci)
          # One make invocation -> build-frontend runs once, shared by the
          # center package targets; the agent targets have no frontend step.
          make package-openwrt package-openwrt-ipk package-openwrt-apk \
               package-openwrt-agent package-openwrt-agent-ipk package-openwrt-agent-apk
          ls -la bin/
          (cd bin && sha256sum *.tar.gz *.ipk *.apk > SHA256SUMS.openwrt)
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages
          path: |
            bin/*.tar.gz
            bin/*.ipk
            bin/*.apk
            bin/SHA256SUMS.openwrt

  # Multi-arch container image → GHCR. The Dockerfile rebuilds the frontend
  # itself (Stage 1), so this job does NOT depend on build-frontend — it runs
  # fully self-contained. Only the unprivileged variant is published
  # (LLDP/CDP/eBPF stay as stubs); users who need those probes build locally
  # with `make docker-build-priv` (see docs/zh/deployment.md).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # GHCR image names must be lowercase; github.repository is "Owner/Repo"
      # (mixed case here) — compute a lowercase full image name once.
      - name: Resolve lowercase image name
        id: repo
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TAGS=

  publish:
    # Needs the binaries, the container image AND the router packages, so a
    # Release is only created when every artifact has succeeded.
    needs: [release, docker, openwrt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Download router packages
        uses: actions/download-artifact@v4
        with:
          name: openwrt-packages
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            mibee-steward-linux-amd64
            mibee-steward-linux-arm64
            mibee-agent-linux-amd64
            mibee-agent-linux-arm64
            mibee-steward-openwrt-arm64-*.tar.gz
            mibee-steward_*_arm64.ipk
            mibee-steward_*_arm64.apk
            SHA256SUMS.openwrt
