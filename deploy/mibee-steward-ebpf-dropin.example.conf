# systemd drop-in to grant the eBPF passive observer the capabilities it
# needs (#495). The stock mibee-steward.service stays zero-privilege by
# design; eBPF is opt-in. Requires the binary to be built with the
# WITH_EBPF tag (`make build-with-ebpf`) and scanner.ebpf.enabled: true.
#
# Install (either form):
#   systemctl edit mibee-steward          # paste the [Service] block below
#   # or copy this file:
#   mkdir -p /etc/systemd/system/mibee-steward.service.d
#   cp deploy/mibee-steward-ebpf-dropin.example.conf \
#      /etc/systemd/system/mibee-steward.service.d/ebpf.conf
#   systemctl daemon-reload && systemctl restart mibee-steward
#
# Verify:
#   mibee-steward doctor -config configs/config.yaml   # "ebpf observer" line
#   journalctl -u mibee-steward | grep -i ebpf

[Service]
# CAP_NET_ADMIN: create clsact qdiscs and attach TC programs.
# CAP_BPF: load BPF programs/maps (kernel 5.8+).
# CAP_PERFMON: not needed by the current TC observer; uncomment only if a
# future tracing-type observer is enabled, for a tighter set.
AmbientCapabilities=CAP_NET_ADMIN CAP_BPF
CapabilityBoundingSet=CAP_NET_ADMIN CAP_BPF
# AmbientCapabilities=CAP_NET_ADMIN CAP_BPF CAP_PERFMON
# CapabilityBoundingSet=CAP_NET_ADMIN CAP_BPF CAP_PERFMON
