# Minimal Prometheus config for monitoring a MiBee Steward center (#279).
# Usage: point Prometheus at this file (or copy the job/rule_files blocks into
# an existing instance). The center exposes /metrics (no auth by default —
# put Prometheus behind the same trust boundary or front it with auth).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: mibee-steward
    static_configs:
      - targets: ["mibee-steward:8080"]  # center host:server.port
    metrics_path: /metrics
