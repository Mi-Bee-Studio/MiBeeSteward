{{- /*
Eval convenience only (#623): production provides an existing Opaque
secret (values.secrets.existingName) so master_key / admin passwords
never transit helm values. When create=true and no existingName, render
one with a RANDOM jwt_secret and an EMPTY initial admin password (the
browser first-run setup creates it); master_key stays unset (v3
credential storage disabled) rather than inventing a weak key.
*/}}
{{- if and .Values.secrets.create (not .Values.secrets.existingName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mibee-steward.fullname" . }}
  labels:
    {{- include "mibee-steward.labels" . | nindent 4 }}
type: Opaque
stringData:
  MIBEE_AUTH_JWT_SECRET: {{ randAlphaNum 43 | quote }}
  MIBEE_AUTH_INITIAL_ADMIN_PASSWORD: ""
{{- end }}
