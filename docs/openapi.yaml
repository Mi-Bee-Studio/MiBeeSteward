# SPDX-License-Identifier: AGPL-3.0-or-later
#
# MiBee Steward — OpenAPI 3.0 specification of the /api/v1 surface.
#
# Contract source of truth for issue #274. Path+method parity with the real
# router is enforced by internal/api/routes/openapi_parity_test.go (a route
# added to the router without a matching entry here fails CI). Prose contract:
# docs/en/api.md §"API Contract" — list envelope, error model, pagination.
#
# Conventions (see the prose contract for the full text):
#   - List responses: { "<resource>": [...], total, limit?, offset? }
#   - Errors: { "error": "<message>" }
#   - Pagination: limit/offset; malformed or negative -> 400; over-max clamps
#     (echoed limit reveals the effective value)
#   - Timestamps: RFC 3339 strings
openapi: 3.0.3
info:
  title: MiBee Steward API
  description: |
    Device management & monitoring system (CMDB-lite for network/IoT assets):
    auto-discovery, identity inference, registry, heartbeat, synthetic
    probing, distributed agents.

    Auth for browser/user routes: JWT — cookie-first with Bearer header
    fallback (`Authorization: Bearer <token>`). Machine routes (the
    /api/v1/agents/{report,probe-report,commands,commands/{id}/...} family)
    use per-agent bearer tokens minted by an admin.
  version: 0.6.0
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
tags:
  - {name: Health}
  - {name: Auth}
  - {name: Users}
  - {name: Devices}
  - {name: Networks}
  - {name: Scanner}
  - {name: ProbeTargets}
  - {name: Credentials}
  - {name: Agents}
  - {name: Changes}
  - {name: Discovery}
  - {name: Audit}
  - {name: Documents}
  - {name: Heartbeat}
  - {name: Dashboard}
  - {name: Topology}
  - {name: Notifications}
  - {name: Settings}
  - {name: Fingerprints}
  - {name: Metrics}

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness + version (public)
      security: []
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  version: {type: string}

  /auth/login:
    post:
      tags: [Auth]
      summary: Login (public, 10 req/min)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
                totp_code: {type: string, description: "TOTP code when 2FA is enabled"}
      responses:
        "200":
          description: Session token + user (or two_factor_required)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginResponse"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate the current session
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /auth/register:
    post:
      tags: [Auth]
      summary: Self-register (disabled unless demo mode; public)
      security: []
      responses:
        "201": {$ref: "#/components/responses/Created"}
        "403": {$ref: "#/components/responses/Error"}
  /auth/setup-status:
    get:
      tags: [Auth]
      summary: First-run password setup status (public)
      security: []
      responses:
        "200":
          description: Whether the browser-guided admin bootstrap is pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_required: {type: boolean}
  /auth/setup:
    post:
      tags: [Auth]
      summary: One-time admin password bootstrap (public; 409 once used)
      security: []
      responses:
        "200":
          description: Full session for the newly-created admin
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginResponse"}
        "409": {$ref: "#/components/responses/Error"}
  /auth/password-policy:
    get:
      tags: [Auth]
      summary: Effective password policy (public; login form hints)
      security: []
      responses:
        "200":
          description: Policy object
          content:
            application/json:
              schema: {type: object}
  /auth/profile:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
    put:
      tags: [Auth]
      summary: Update own profile (email / display name)
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /auth/password:
    put:
      tags: [Auth]
      summary: Change own password
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "400": {$ref: "#/components/responses/Error"}
  /auth/force-password:
    put:
      tags: [Auth]
      summary: Complete forced first-login password change (clears the mcp gate)
      responses:
        "200":
          description: Fresh session without the password_change_required claim
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginResponse"}
  /auth/2fa/status:
    get:
      tags: [Auth]
      summary: TOTP 2FA enrollment status for the current user
      responses:
        "200": {description: "{enabled: boolean}"}
  /auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Verify a TOTP code during login (public + login rate limit)
      security: []
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginResponse"}
  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Begin TOTP enrollment (returns the secret + otpauth URL)
      responses:
        "200": {description: "{secret, otpauth_url}"}
  /auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Confirm TOTP enrollment with a valid code
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Remove TOTP (requires a valid code)
      responses:
        "200": {$ref: "#/components/responses/OK"}

  /users:
    get:
      tags: [Users]
      summary: List users (admin)
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        - {name: search, in: query, schema: {type: string}}
      responses:
        "200":
          description: User list envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserList"}
  /users/batch-delete:
    post:
      tags: [Users]
      summary: Bulk-delete users (admin)
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /users/{id}/reset-password:
    post:
      tags: [Users]
      summary: Admin resets another user's password
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /users/{id}/network-grants:
    get:
      tags: [Users]
      summary: Networks granted to a user (scope editor source)
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Grants envelope (complete list)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkGrantList"}

  /network-grants:
    get:
      tags: [Users]
      summary: All network grants (admin)
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
      responses:
        "200":
          description: Grants envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkGrantList"}
    post:
      tags: [Users]
      summary: Grant a user access to a network
      responses:
        "201": {$ref: "#/components/responses/Created"}
        "409": {$ref: "#/components/responses/Error"}
  /network-grants/{id}:
    delete:
      tags: [Users]
      summary: Revoke a grant
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "204": {description: Revoked}

  /devices:
    get:
      tags: [Devices]
      summary: List devices (filters status/type/search/sort/order/network_id/created_from/created_to)
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        - {name: status, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}}
        - {name: network_id, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Device list envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceList"}
    post:
      tags: [Devices]
      summary: Create a device (manual entry)
      responses:
        "201":
          description: Created device
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
  /devices/export:
    get:
      tags: [Devices]
      summary: CSV/JSON export (query mirrors the list endpoint)
      responses:
        "200": {description: File download}
  /devices/stats:
    get:
      tags: [Devices]
      summary: Status/type counters
      responses:
        "200": {description: "{by_status: {...}}"}
  /devices/{id}:
    get:
      tags: [Devices]
      summary: One device (out-of-scope = 404)
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Devices]
      summary: Update editable device fields
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
    delete:
      tags: [Devices]
      summary: Delete a device (cascades satellites)
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "204": {description: Deleted}
  /devices/batch-delete:
    post:
      tags: [Devices]
      summary: Bulk delete
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /devices/batch-update-status:
    post:
      tags: [Devices]
      summary: Bulk status change
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /devices/{id}/systems:
    get:
      tags: [Devices]
      summary: Device system entries (hardware/OS/license inventory)
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        - {name: category, in: query, schema: {type: string}}
      responses:
        "200":
          description: Systems envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceSystemList"}
    post:
      tags: [Devices]
      summary: Add a system entry
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "201": {$ref: "#/components/responses/Created"}
  /devices/{id}/systems/{systemId}:
    get:
      tags: [Devices]
      summary: One system entry
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {name: systemId, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {description: System entry}
    put:
      tags: [Devices]
      summary: Update a system entry
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {name: systemId, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {$ref: "#/components/responses/OK"}
    delete:
      tags: [Devices]
      summary: Delete a system entry
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {name: systemId, in: path, required: true, schema: {type: integer}}
      responses:
        "204": {description: Deleted}
  /devices/{id}/neighbors:
    get:
      tags: [Devices]
      summary: LLDP/CDP/Bridge-MIB neighbors of a device
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Neighbors envelope (complete list)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NeighborList"}
  /devices/{id}/certificates:
    get:
      tags: [Devices]
      summary: TLS certificate chains seen on the device's services
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Certificates envelope (complete list)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CertificateList"}
  /devices/{id}/configs:
    get:
      tags: [Devices]
      summary: SSH config-backup versions (404 on unknown device)
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
      responses:
        "200":
          description: Config versions envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceConfigList"}
        "404": {$ref: "#/components/responses/Error"}
  /devices/{id}/configs/diff:
    get:
      tags: [Devices]
      summary: Unified diff between two versions (?a=&b=)
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {name: a, in: query, required: true, schema: {type: integer}}
        - {name: b, in: query, required: true, schema: {type: integer}}
      responses:
        "200": {description: Diff payload}
  /devices/{id}/configs/{configId}:
    get:
      tags: [Devices]
      summary: Full text of one config version
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {name: configId, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {description: Config detail}
        "404": {$ref: "#/components/responses/Error"}
  /devices/{id}/documents:
    get:
      tags: [Documents]
      summary: Documents linked to a device
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Documents envelope (complete list)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceDocumentList"}
    post:
      tags: [Documents]
      summary: Link a document to a device
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "201": {$ref: "#/components/responses/Created"}
  /devices/{id}/documents/{docId}:
    delete:
      tags: [Documents]
      summary: Unlink a document
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {name: docId, in: path, required: true, schema: {type: integer}}
      responses:
        "204": {description: Unlinked}
  /devices/{uuid}/fingerprint-draft:
    post:
      tags: [Fingerprints]
      summary: Draft a fingerprint rule from a device's accumulated evidence
      parameters:
        - {name: uuid, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: YAML rule draft (text/yaml)}
  /devices/{id}/heartbeat-configs:
    get:
      tags: [Heartbeat]
      summary: Heartbeat probe configs of a device
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Configs envelope (complete list)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HeartbeatConfigList"}
    post:
      tags: [Heartbeat]
      summary: Add a heartbeat config (icmp/tcp/http/snmp)
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "201": {$ref: "#/components/responses/Created"}
  /heartbeat-configs/{id}:
    put:
      tags: [Heartbeat]
      summary: Update a heartbeat config
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/OK"}
    delete:
      tags: [Heartbeat]
      summary: Delete a heartbeat config
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "204": {description: Deleted}
  /devices/{id}/heartbeat-results:
    get:
      tags: [Heartbeat]
      summary: Recent heartbeat results (time-window filter)
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        - {name: start_date, in: query, schema: {type: string, format: date-time}}
        - {name: end_date, in: query, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Results envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HeartbeatResultList"}
  /devices/{id}/heartbeat-results/export:
    get:
      tags: [Heartbeat]
      summary: CSV export of heartbeat results
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {description: File download}
  /devices/{id}/heartbeat-history:
    get:
      tags: [Heartbeat]
      summary: Liveness time series (?from=&to=, max 90 days)
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Liveness samples envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HeartbeatResultList"}
  /devices/{id}/heartbeat-stats:
    get:
      tags: [Heartbeat]
      summary: Online ratio / offline duration aggregates
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {description: Stats object}

  /networks:
    get:
      tags: [Networks]
      summary: All logical networks (complete list, {networks,total})
      responses:
        "200":
          description: Networks envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkList"}
    post:
      tags: [Networks]
      summary: Register a logical network
      responses:
        "201":
          description: Created network
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Network"}
  /networks/{id}:
    get:
      tags: [Networks]
      summary: One network
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Network
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Network"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [Networks]
      summary: Update name/cidr/site (agent_id is managed via tokens)
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Updated network
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Network"}
    delete:
      tags: [Networks]
      summary: Delete a network (devices' network_id set null)
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "204": {description: Deleted}
  /networks/{id}/vlans:
    get:
      tags: [Networks]
      summary: 802.1Q VLANs observed on a network
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: VLANs envelope (complete list)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VLANList"}

  /scanner/scan:
    post:
      tags: [Scanner]
      summary: Synchronous scan (max 1024 IPs — larger ranges must use tasks)
      responses:
        "200": {description: "{hosts, total, alive, duration_ms}"}
        "413": {$ref: "#/components/responses/Error"}
  /scanner/add-devices:
    post:
      tags: [Scanner]
      summary: Import scan results as manual devices
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "422": {$ref: "#/components/responses/Error"}
  /scanner/tasks:
    get:
      tags: [Scanner]
      summary: Scan tasks
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        - {name: search, in: query, schema: {type: string}}
      responses:
        "200":
          description: Tasks envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanTaskList"}
    post:
      tags: [Scanner]
      summary: Create a scan task (cron schedule; agent-network targets auto-dispatch)
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanTask"}
  /scanner/tasks/{id}:
    get:
      tags: [Scanner]
      summary: One task (pipeline_config is an object, not a string)
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanTask"}
    put:
      tags: [Scanner]
      summary: Update a task
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanTask"}
    delete:
      tags: [Scanner]
      summary: Delete a task
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "204": {description: Deleted}
  /scanner/tasks/{id}/trigger:
    post:
      tags: [Scanner]
      summary: Trigger a run now (rate-limited 10/min)
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "202": {description: Run queued}
  /scanner/tasks/{id}/cancel:
    post:
      tags: [Scanner]
      summary: Cancel the in-flight run
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /scanner/tasks/{id}/runs:
    get:
      tags: [Scanner]
      summary: Run history of a task
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
      responses:
        "200":
          description: Runs envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanRunList"}
  /scanner/tasks/{id}/results:
    get:
      tags: [Scanner]
      summary: Latest results of a task
      parameters:
        - {$ref: "#/components/parameters/id"}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
      responses:
        "200":
          description: Results envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanResultList"}
  /scanner/runs:
    get:
      tags: [Scanner]
      summary: All runs (filter task_id)
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        - {name: task_id, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Runs envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanRunList"}
  /scanner/runs/{id}:
    get:
      tags: [Scanner]
      summary: One run
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanRun"}
  /scanner/results:
    get:
      tags: [Scanner]
      summary: Browse results (task_id/ip/alive/sort/order filters)
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        - {name: task_id, in: query, schema: {type: integer}}
        - {name: ip, in: query, schema: {type: string}}
        - {name: alive, in: query, schema: {type: string, enum: ["0", "1"]}}
        - {name: sort, in: query, schema: {type: string}}
        - {name: order, in: query, schema: {type: string}}
      responses:
        "200":
          description: Results envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanResultList"}
    delete:
      tags: [Scanner]
      summary: Bulk delete results (retention helper)
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /scanner/results/{id}:
