      tags: [Metrics]
      summary: Prometheus http_sd target groups (public)
      security: []
      responses:
        "200": {description: SD target group JSON}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT from POST /auth/login (Bearer fallback when cookies are unavailable)
    cookieAuth:
      type: apiKey
      in: cookie
      name: mibee_token
      description: JWT session cookie (preferred transport)
    agentToken:
      type: http
      scheme: bearer
      description: Per-agent token minted via POST /agents/tokens (machine channel)

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64}
    limit:
      name: limit
      in: query
      description: Page size (absent/0 → endpoint default; malformed or negative → 400; over-max clamps)
      schema: {type: integer, format: int64, minimum: 0}
    offset:
      name: offset
      in: query
      description: Pagination offset (negative → 400)
      schema: {type: integer, format: int64, minimum: 0}

  responses:
    OK:
      description: Generic success
      content:
        application/json:
          schema: {type: object}
    Created:
      description: Created resource
      content:
        application/json:
          schema: {type: object}
    Error:
      description: Error envelope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message (single-field error model)

    PageMeta:
      type: object
      description: Echo of the effective pagination (absent on complete lists)
      properties:
        total: {type: integer, format: int64, description: Filtered count}
        limit: {type: integer, format: int64}
        offset: {type: integer, format: int64}

    LoginResponse:
      type: object
      properties:
        token: {type: string}
        user: {$ref: "#/components/schemas/User"}
        two_factor_required: {type: boolean}
        user_id: {type: integer}

    User:
      type: object
      properties:
        id: {type: integer}
        username: {type: string}
        email: {type: string}
        role: {type: string, enum: [admin, operator, viewer, user]}
        must_change_password: {type: boolean}
        created_at: {type: string, format: date-time}
    UserList:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            users:
              type: array
              items: {$ref: "#/components/schemas/User"}

    NetworkGrantList:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            grants:
              type: array
              items:
                type: object
                properties:
                  id: {type: integer}
                  user_id: {type: integer}
                  username: {type: string}
                  network_id: {type: integer}
                  network_name: {type: string}
                  granted_at: {type: string, format: date-time}

    Device:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: string, description: "e.g. camera, server, pc, switch, other"}
        brand: {type: string}
        model: {type: string}
        status: {type: string, enum: [online, offline, warning, unknown]}
        ip_address: {type: string}
        mac_address: {type: string}
        network_id: {type: integer, nullable: true}
        device_uuid: {type: string}
        scan_source: {type: string, description: "scanner_v2 | manual | passive:*"}
        last_seen: {type: string, format: date-time, nullable: true}
        open_ports: {type: array, items: {type: object}}
        detected_services: {type: array, items: {type: object}}
        scan_attributes: {type: object, description: "Evidence-derived attributes (mac, oui_vendor, inferred_type, ...)"}
        user_attributes: {type: object}
        tags: {type: object}
    DeviceList:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            devices:
              type: array
              items: {$ref: "#/components/schemas/Device"}

    DeviceSystemList:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            systems: {type: array, items: {type: object}}

    NeighborList:
      type: object
      properties:
        neighbors: {type: array, items: {type: object}}
        total: {type: integer}

    CertificateList:
      type: object
      properties:
        certificates:
          type: array
          items:
            type: object
            properties:
              port: {type: integer}
              tls_version: {type: string}
              cipher_suite: {type: string}
              trusted: {type: boolean}
              updated_at: {type: string, format: date-time}
              chain: {type: array, items: {type: object}}
        total: {type: integer}

    DeviceConfigList:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  id: {type: integer}
                  device_id: {type: integer}
                  config_hash: {type: string}
                  protocol: {type: string}
                  has_diff: {type: boolean}
                  fetched_at: {type: string, format: date-time}

    DeviceDocumentList:
      type: object
      properties:
        documents: {type: array, items: {$ref: "#/components/schemas/Document"}}
        total: {type: integer}

    HeartbeatConfigList:
      type: object
      properties:
        configs: {type: array, items: {type: object}}
        total: {type: integer}
    HeartbeatResultList:
      allOf:
