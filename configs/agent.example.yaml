# MiBee Steward AGENT: minimal config sample (distributed form).
#
# The agent scans the LAN it sits on and reports upstream to a center; the
# center owns the device registry. Everything not set here keeps the built-in
# default (the full key reference lives in configs/config.example.yaml: same
# loader, same keys; docs/{en,zh}/distributed.md is the form's manual).
#
# REQUIRED before start: center.url + center.auth_token (minted on the center
# via POST /api/v1/agents/tokens, bound to a networks row for this LAN) +
# network.cidr (attribution + scan-target validation).
#
# The agent's local shadow DB lands as agent.db NEXT TO this file; on a router
# point -config at a /tmp location (tmpfs) to spare flash: see
# deploy/openwrt/mibee-agent.init.

center:
  url: ""                 # e.g. "http://192.168.62.40:8080": the remote center
  auth_token: ""          # agent bearer token minted on the center (REQUIRED with url)
  report_interval: "30s"  # flush buffered reports; default 30s

network:
  name: ""                # e.g. "lan-63"; informational + shown on the center
  cidr: ""                # e.g. "192.168.63.0/24"; this LAN's subnet

# Passive discovery sources for a ROUTER-resident agent (the agent IS the
# gateway here: the Tier-1 signals are free). A plain-host agent keeps this
# block off (defaults) or enables arp_cache/multicast only.
scanner:
  discovery:
    enabled: true
    arp_cache:
      enabled: true
    multicast:
      enabled: true
    # Tier-1 router signals: no-ops on a non-router host.
    dhcp_leases:
      enabled: true
    conntrack:
      enabled: true
    hostapd:
      enabled: true
      interfaces: []      # e.g. ["wlan0"]; empty probes /var/run/hostapd/*
