server:
  port: 8080
  host: "0.0.0.0"
  # HTTP server timeouts. write_timeout MUST exceed the slowest synchronous
  # endpoint — primarily POST /scanner/scan on large CIDRs. The server
  # auto-raises write_timeout to scanner.default_timeout×2+30s if configured
  # lower, so synchronous scans are never truncated by a too-tight timeout.
  # For very large ranges (>/24) prefer the async task API.
  read_timeout: "15s"
  write_timeout: "5m"
  idle_timeout: "120s"
  # trusted_proxies authorizes which source IPs may set X-Forwarded-For (used
  # by rate limiting + audit logs to identify the real client behind a proxy).
  # Empty (default) = trust NO proxy: the TCP peer IS the client — the safe
  # default for direct exposure (a client cannot forge its IP). Deploy behind
  # nginx/another proxy and set this to the proxy's source range so the real
  # client IP is honored. Bare IPs are treated as /32 (v4) or /128 (v6).
  # Override at runtime with MIBEE_SERVER_TRUSTED_PROXIES (comma-separated).
  trusted_proxies: []  # e.g. ["127.0.0.1/32"] for a localhost nginx, or ["10.0.0.5/32"]

database:
  sqlite:
    path: "./data/mibee.db"

# Network this instance is responsible for. Resolved to a `networks` table row
# at startup; discovered devices are tagged with its id (devices.network_id) so
# multiple instances on different LANs can coexist without IP collisions.
#   - Single instance: leave at default ("default") — devices get network_id set.
#   - Distributed: each agent sets a distinct name (e.g. "lan-63", "branch-bj").
network:
  name: "default"
  cidr: ""        # e.g. "192.168.63.0/24" — advisory, not enforced
  site: ""        # e.g. "hq" / "datacenter-1"

# center configures a discovery AGENT's upstream aggregation center. When url
# is non-empty the binary runs in AGENT mode: it runs the scannerv2 engine
# locally and reports results to this center via POST /agents/report (auth:
# auth_token, a long-lived agent token minted on the center via
# POST /api/v1/agents/tokens, bound to a networks row whose agent_id matches).
# Empty url = center/standalone mode (serve API + SPA, no upstream reporting).
# Distributed model: see docs/{en,zh}/distributed-guide.md.
center:
  url: ""               # e.g. "http://192.168.63.101:8080"; empty = standalone
  auth_token: ""        # agent bearer token from the center; REQUIRED when url set
  report_interval: "30s" # flush buffered results when buffer not full; default 30s

# security holds process-wide secret keying material. master_key protects
# SNMPv3 USM auth/priv passphrases stored in SQLite (AES-256-GCM). Generate
# one with: head -c 32 /dev/urandom | base64  (then base64-decode to 32 raw
# bytes, OR paste 32 ASCII characters here directly). It MUST be exactly 32
# bytes. OPTIONAL: leave empty to disable v3 credential storage (v1/v2c
# scans work without it); required once any v3 credential exists. Override
# at runtime with MIBEE_SECURITY_MASTER_KEY.
security:
  master_key: ""

rbac:
  # Object-level network scope for non-admin roles (#138 Phase 2).
  #   open  (default): a non-admin user sees every network (current behavior;
  #                    network grants are recorded but not enforced).
  #   closed          : a non-admin user sees only networks they hold a grant
  #                    for (MSP / multi-tenant isolation). Admin always bypasses.
  # PREVIEW (v1): "closed" currently scopes the device browse surface — the
  # device LIST (GET /devices) and device detail + per-device sub-resources
  # (GET/PUT/DELETE /devices/{id} and /devices/{id}/{neighbors,certificates,
  # configs,systems,heartbeat-*,documents}) enforce the granted-network set.
  # Topology, change log, dashboard, device stats/export, and scanner
  # results/runs/tasks are NOT yet network-scoped (#138 Phase 2b — the scanner
  # tables also lack a network_id column) and remain visible across networks
  # until then. Do not enable "closed" for strict multi-tenant isolation until
  # 2b lands; "open" is fully safe (no behavior change).
  scope_default: "open"

auth:
  jwt_secret: "change-me-in-production"  # REQUIRED — must change, minimum 32 characters
  token_expiry: "24h"
  initial_admin_password: "change-me"  # REQUIRED — must change for production
  cookie_domain: ""             # Domain for auth cookie (empty = current domain)
  cookie_secure: true          # Set false only for local development without HTTPS
  cookie_same_site: "strict"   # "strict" or "lax"
  cookie_max_age: "24h"           # Cookie MaxAge (defaults to token_expiry if not set)
cors:
  allowed_origins:
    - "https://your-domain.com"  # Replace with your actual domain
    # Remove localhost origins for production

heartbeat:
  default_interval: 30
  timeout: 5
  retention_days: 30
  # Cadence of the heartbeat probing loop in seconds (default 30). The loop
  # polls every device whose per-device interval is due and writes verdicts to
  # an in-memory cache. Lower = faster liveness detection + more probe load;
  # higher = the opposite. 0 = use default (30). Large fleets or tight RTT
  # budgets may want to tune this. MIBEE_HEARTBEAT_TICK_INTERVAL_SECONDS.
  tick_interval_seconds: 30
  # Number of consecutive probe failures before a device flips to "offline"
  # (default 5). This is the heartbeat-side (probe-based) death sensitivity;
  # scanner.lost_threshold is the scan-side (absence-based) one. Lower = more
  # responsive but more flap-prone; higher = more stable but slower to declare.
  # 0 = use default (5). MIBEE_HEARTBEAT_OFFLINE_THRESHOLD.
  offline_threshold: 5
  # Probe an already-offline device once every N ticks instead of every tick
  # (default 10 → ~5min on a 30s ticker for known-dead hosts vs 30s for live
  # ones). 0 = use default. A scan that revives a host clears this immediately.
  offline_backoff_ticks: 10

prometheus:
  enabled: true
  metrics_path: "/metrics"

dashboard:
  data_source_type: "prometheus"
  prometheus_url: "http://localhost:9090"

storage:
  upload_path: "./data/uploads"
  max_file_size: 104857600  # 100MB

# Log configuration
# level: debug, info, warn, error (default: info)
# format: json, text (default: text)
log:
  level: "info"
  format: "text"

rate_limit:
  login_per_minute: 10
  global_per_minute: 600  # per-IP cap on all API routes. 600/min leaves headroom for background polling (dashboard/devices ~5/min each) + multi-tab + normal clicking; SPA static assets under /_app/* are exempt. Raise for NAT-shared-IP deployments.
  scan_per_minute: 10           # per-IP cap on /scan + /tasks/{id}/trigger

# SMTP configuration for email notifications
smtp:
  host: ""
  port: 587
  username: ""
  password: ""
  from_address: "noreply@mibee-steward.local"

# Scanner configuration for network discovery
scanner:
  enabled: true
  max_concurrent_scans: 3
  default_timeout: 300        # seconds, per-host pipeline timeout (upper bound for ALL probes + handlers on one host)
  per_probe_timeout: 3        # seconds, single probe attempt (one SNMP Get / TCP dial / HTTP fetch). Keep small so dead hosts fail fast.
  max_concurrent_hosts: 50
  # Number of consecutive scans a device must be absent from the alive set
  # before being declared "lost" (default 2). Single missed scans (ICMP drop,
  # brief downtime, jitter) must not flap a device offline. This is the
  # scan-side (absence-based) death sensitivity; heartbeat.offline_threshold
  # is the probe-based one. 0 = use default (2). MIBEE_SCANNER_LOST_THRESHOLD.
  lost_threshold: 2
  retention_days: 30
  default_cron_expr: "0 */6 * * *"
  # v2 engine tuning (the legacy v1 engine has been removed).
  # engine is retained for compatibility but only "v2" is supported.
  engine: "v2"
  # persist_raw_evidence writes every probe observation to service_evidence.
  # Off by default — raw evidence can be voluminous; enable for debugging.
  persist_raw_evidence: false
  # oui_path points to the IEEE OUI vendor-mapping file (MA-L + MA-M + MA-S,
  # fetched by scripts/fetch-oui.sh). The ARP probe derives a vendor from each
  # discovered MAC via longest-prefix-match across the three registries.
  # When empty (default), the engine uses a small EMBEDDED curated table of
  # common vendors (out-of-box coverage); set this to a full IEEE file for
  # complete coverage. Override at runtime with MIBEE_SCANNER_OUI_PATH.
  oui_path: ""
  # fingerprint_path points to a directory of fingerprint YAML rule files (see
  # configs/fingerprints/ + docs/fingerprint-spec.md). When empty, the engine
  # uses the fingerprint rules embedded in the binary (zero-config). Override at
  # runtime with MIBEE_SCANNER_FINGERPRINT_PATH. Point this at a custom rule
  # directory to extend device/service identification without recompiling.
  fingerprint_path: ""
  # snmp_community overrides the default SNMP community ("public") used by the
  # SNMP probe. Override at runtime with MIBEE_SCANNER_SNMP_COMMUNITY.
  snmp_community: "public"
  # router_arp enables cross-subnet MAC resolution. When populated, the scanner
  # walks these routers' SNMP ARP tables (ipNetToMediaPhysAddress) to find MACs
  # for hosts the scanner can't reach at L2 (e.g. cameras on a different VLAN).
  # Requires the router to run SNMP with the given community. Empty (default)
  # → cross-subnet MAC disabled; the scanner falls back to /proc/net/arp (local
  # subnet only).
  router_arp:
    routers: []        # e.g. ["192.168.63.1", "192.168.62.1"]
    community: "public"
    timeout: 4         # seconds per router walk
  # rdns tunes the reverse-DNS probe (active:rdns). By default it uses the
  # system resolver (/etc/resolv.conf), which on a center box often points at
  # a public DNS with no view into the LAN's DHCP-synthesized PTR records — so
  # hostnames are missed for devices that DO have a PTR on the local DNS.
  # Populating dns_servers (e.g. the router/LAN DNS IP) makes the probe query
  # those servers directly for PTR records. Each entry is host or host:port.
  # Empty = use the system resolver. Override with MIBEE_SCANNER_RDNS_DNS_SERVERS.
  rdns:
    dns_servers: []    # e.g. ["192.168.63.1"] (the LAN DNS / router)
    timeout: 2         # seconds per lookup
  # mdns tunes the mDNS probe (active:mdns). unicast_queries also sends a
  # unicast query to each target's 5353 port (in addition to multicast),
  # reaching devices that answer unicast but not multicast.
  mdns:
    unicast_queries: false
  # arp_scan is the active ARP-sweep discovery SOURCE (distinct from the
  # passive arp_cache above): it broadcasts ARP who-has for every IP in the
  # local subnet and emits a host per reply. The cadence reuses
  # discovery.interval (no separate knob here). Needs CAP_NET_RAW + the
  # WITH_ARPSCAN build tag; remains a no-op in the default build.
  arp_scan:
    interface: ""      # NIC to send on; empty = auto-select by network.cidr
  pipeline_defaults:
    icmp_enabled: true
    snmp_enabled: true
    port_scan_enabled: true
    default_ports: "22,21,23,25,53,80,110,143,389,443,445,554,631,636,8554,1433,3306,3389,5432,5900,6379,8000,8080,8081,8443,8888,9000,9090,9100,9104,9113,9121,9187,9200,9443,11211,27017,161"
    service_detection_enabled: true
    prometheus_check_enabled: true
    node_exporter_enabled: true
  # eBPF passive observer (TC ingress). No-op unless the binary was built
  # with `make build-with-ebpf` (WITH_EBPF tag). Requires Linux ≥5.8 + BTF
  # and CAP_BPF/CAP_NET_ADMIN at runtime. Empty interfaces → all non-loopback.
  ebpf:
    enabled: false
    interfaces: []
  # Passive discovery service — spots newly-appeared hosts BETWEEN scheduled
  # scans with near-zero active traffic. It diffs router/local ARP tables and
  # passively listens for mDNS/SSDP (never sends queries), then feeds new hosts
  # through the same device bridge as scans (device_added events + heartbeat
  # seeding). This shrinks the discovery-to-record gap from "next 6h scan" to
  # ~1 minute. Disabled by default; enable when you want quasi-realtime
  # onboarding of new devices.
  discovery:
    enabled: false
    interval: 60          # seconds — poll cadence for the ARP-based sources
    trigger_identify: true # run a single-IP full identification scan on each
                           # new host so it gets a type + services immediately
                           # (recommended; set false to record as "unknown")
    # router_arp: walks scanner.router_arp.routers' SNMP ARP tables. Widest
    # coverage — a gateway knows every host that talks through it. One SNMP Walk
    # per router per interval; no end-host traffic. No-op without routers.
    router_arp:
      enabled: true
    # arp_cache: diffs the local /proc/net/arp kernel cache. Zero network
    # traffic; covers hosts the scanner host has communicated with (including
    # those populated by the scheduled scan's ICMP/TCP probes).
    arp_cache:
      enabled: true
    # multicast: passively listens on mDNS (224.0.0.251:5353) + SSDP
    # (239.255.255.250:1900) for self-advertising devices (cameras/printers/
    # IoT/Mac/UPnP). Zero outbound traffic; supplemental coverage only.
    # Binds with SO_REUSEADDR to coexist with avahi/systemd-resolved; if the
    # port is unavailable the source disables itself without crashing.
    multicast:
      enabled: true
    # dhcp_leases: Tier-1 ROUTER signal. Reads the local DHCP server's lease
    # table (dnsmasq /tmp/dhcp.leases on OpenWrt, /var/lib/misc/dnsmasq.leases
    # on Debian) — the authoritative hostname↔MAC↔IP map, covering devices
    # (sleeping IoT, firewalled hosts) that never answer SNMP/ICMP/rDNS. No-op
    # on a host that isn't the LAN's DHCP server (file absent → source skips).
    # Enable when the center/agent runs ON the gateway (router form).
    dhcp_leases:
      enabled: false
    # conntrack: Tier-1 ROUTER signal. Reads /proc/net/nf_conntrack and emits
    # the LAN-side endpoint of every ESTABLISHED/ASSURED flow — the NAT choke
    # point's "who is talking RIGHT NOW" view. Liveness + discovery for hosts
    # that don't answer active probes but maintain outbound flows. Filters to
    # network.cidr so it doesn't emit a row per public IP. No-op when the
    # nf_conntrack module isn't loaded. Enable on a router/gateway.
    conntrack:
      enabled: false
    # hostapd: Tier-1 ROUTER/AP signal. Enumerates the WiFi STAs associated to
    # the local AP via the hostapd control socket (/var/run/hostapd/<phy>),
    # falling back to `iw station dump`. Captures signal dBm / connect time /
    # SSID — gold for device tracking, unavailable to a wired host. interfaces
    # lists the wlan names to poll (e.g. ["wlan0"]); empty = autodetect. No-op
    # on a host without WiFi/hostapd/iw.
    hostapd:
      enabled: false
      interfaces: []  # e.g. ["wlan0", "wlan1"]; empty probes /var/run/hostapd/*
    # dns_log: Tier-1 ROUTER signal. Tails the dnsmasq query log (--log-queries
    # output) and emits each querying host + the domain — a powerful passive
    # fingerprint (devices that block inbound probes still do outbound DNS).
    # Operator MUST enable dnsmasq query logging (UCI: `uci set
    # dhcp.@dnsmasq[0].logqueries=1`). path overrides the log file location;
    # empty probes the conventional paths. No-op when no log file is found.
    dns_log:
      enabled: false
      path: ""  # e.g. /var/log/dnsmasq.log; empty probes conventional paths
  # ── Agent lease (distributed model) ───────────────────────────────────────
  # Agent-managed devices (networks with agent_id set) are kept online by their
  # agent's reports — the center does NOT probe them locally (cross-subnet ICMP
  # would always fail and flap them offline). The report refreshes a per-device
  # lease; if an agent stops reporting a host, the lease sweeper below expires
  # it (marks offline + emits device_lost). Only agent networks are swept; the
  # center's own network uses the local-scan DetectLost path + heartbeat.
  agent_lease_ttl: "5m"        # how long a snapshot may be stale before expiring
  lease_sweep_interval: "60s"  # how often the expiration sweep runs
  # reconcile_interval is how often the background network-attribution
  # reconciliation job runs. It detects devices whose IP falls OUTSIDE their
  # stamped network's CIDR — the bottom-line defense that catches drift the
  # Layer 1/2 boundary checks miss. Low-frequency audit, not a hot path.
  # Center-only; the agent does not run reconciliation. 0 = default 1h.
  reconcile_interval: "1h"
# ── Retention (data-volume management) ─────────────────────────────────────
# The retention sweeper runs every sweep_interval_hours and prunes each
# high-volume detail table in batches of batch_size rows (batching avoids
# locking the database on a single giant DELETE). A field of 0 means "use the
# documented default", NOT "keep forever" — these tables are never retained
# indefinitely.
#
# Defaults: heartbeat 7d, scan_results/runs 30d, audit 90d, notifications 30d,
# service_evidence 14d, host_tls_certs 30d, sweep every 6h, batches of 5000.
#
# silent_device_*: scanner-discovered devices (scan_source='scanner_v2') that
# have had NO heartbeat (all probe configs failing) for longer than these
# windows are physically DELETED (manual devices are never auto-deleted). A
# device WITH a MAC gets silent_device_days_mac (7d — a real asset may be
# genuinely gone for a while); a device WITHOUT a MAC gets
# silent_device_hours_no_mac (24h — a mac-less identity is unreliable and pruned
# faster). A device that recovers (5 consecutive online probe cycles) clears its
# offline clock. Each deletion is logged to change_log as device_removed.
retention:
  heartbeat_results_days: 7
  # device_liveness: per-device online/offline verdict series (sampled every
  # heartbeat tick + on scan/lease transitions). Must cover the longest window
  # the change engine queries (24h trend), so it tracks heartbeat_results (7d).
  # The series is disposable (devices.status is source of truth).
  device_liveness_days: 7
  scan_results_days: 30
  scan_task_runs_days: 30
  audit_logs_days: 90
  notification_log_days: 30
  service_evidence_days: 14
  # change_log: device_added / changed / lost / recovered events. High value
  # for asset-history audits, but grows fast (one row per real change per scan).
  change_log_days: 30
  # device_neighbors: L2 adjacency edges (Bridge-MIB / LLDP / CDP). Low write
  # volume (upserted, not appended) + high value for topology history.
  device_neighbors_days: 90
  # host_services: classified service identities (upserted per scan). Rows for
  # gone-silent hosts linger; this prunes them.
  host_services_days: 30
  host_tls_certs_days: 30
  silent_device_days_mac: 7
  silent_device_hours_no_mac: 24
  sweep_interval_hours: 6
  batch_size: 5000
