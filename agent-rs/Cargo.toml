[workspace]
resolver = "2"
members = ["crates/mibee-fingerprints", "crates/mibee-agent"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "process", "signal", "io-util"] }
regex = "1"
regex-syntax = "0.8"

[workspace.dependencies.unicode-case-mapping]
version = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
