    priority: 116
    exclusive_group: xiaomi-device-host
    match:
      kind: hostname
      field: hostname
      op: regex
      value: '(?i)^[0-9]{7}[0-9]{0,3}[a-z]{1,3}(?:\.[0-9a-z-]+)*$'
    service: miot
    protocol: hostname
    confidence: 0.5
    extract:
      metadata:
        inferred_brand: { const: "Xiaomi" }
        ecosystem: { const: "Xiaomi" }
        appliance: { const: "smartphone" }

