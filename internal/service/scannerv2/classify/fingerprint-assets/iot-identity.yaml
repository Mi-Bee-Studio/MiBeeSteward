      kind: hostname
      field: hostname
      op: regex
      # Group 1 = the model token before the suffix ("sread9" in
      # philips-light-sread9_mibtB8DC); the suffix itself stays non-capturing.
      value: '(?i)(?:[^-_.]*[-_.])*?([0-9a-z]+)_(?:miap|mibt)[0-9a-f]+(?:\.[0-9a-z-]+)*$'
    service: miot
    protocol: hostname
    confidence: 0.55
    extract:
